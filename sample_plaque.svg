<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Noto+Sans+Ethiopic:wght@400;700&amp;display=swap');
      .font-main { font-family: 'Inter', 'Noto Sans Ethiopic', -apple-system, BlinkMacSystemFont, sans-serif; }
      .bold { font-weight: 700; }
      .extrabold { font-weight: 800; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Plate with Chamfered Border -->
  <rect x="10" y="10" width="580" height="330" rx="16" fill="#0B2545" stroke="#134074" stroke-width="4" filter="url(#shadow)" />
  <rect x="18" y="18" width="564" height="314" rx="10" fill="none" stroke="#134074" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Corner Screw Holes for mounting -->
  <circle cx="30" cy="30" r="4" fill="#134074" opacity="0.8" />
  <circle cx="570" cy="30" r="4" fill="#134074" opacity="0.8" />
  <circle cx="30" cy="320" r="4" fill="#134074" opacity="0.8" />
  <circle cx="570" cy="320" r="4" fill="#134074" opacity="0.8" />

  <!-- Left Side: Address Details -->
  <g class="font-main" transform="translate(45, 60)">
    <!-- Header / Region -->
    <text x="0" y="0" font-size="14" fill="#8DA9C4" letter-spacing="1.5" text-transform="uppercase" class="bold">
      ET • Addis Ababa (አዲስ አበባ)
    </text>

    <!-- SubCity / Zone -->
    <text x="0" y="32" font-size="22" fill="#EEF4F8" class="bold">
      Yeka • የካ
    </text>

    <!-- Woreda & House (if available) -->
    <text x="0" y="62" font-size="16" fill="#F4D06F" class="bold">
      Woreda 03  |  House 104
    </text>

    <!-- Big Digital Address Code -->
    <g transform="translate(0, 110)">
      <text x="0" y="0" font-size="11" fill="#8DA9C4" letter-spacing="1">MEGENAGNA DIGITAL ADDRESS</text>
      <text x="0" y="38" font-size="34" fill="#EEF4F8" class="extrabold" letter-spacing="2">
        C2+4Q
      </text>
      <text x="0" y="65" font-size="13" fill="#8DA9C4">
        Full Code: <tspan fill="#EEF4F8" class="bold">6GXW2RC2+4Q</tspan>
      </text>
      <text x="0" y="85" font-size="11" fill="#8DA9C4">
        ET-AA-YK-W03-H104-C2+4Q
      </text>
    </g>
  </g>

  <!-- Right Side: QR Code Plate -->
  <g transform="translate(410, 55)">
    <!-- QR Background Card -->
    <rect x="0" y="0" width="145" height="175" rx="10" fill="#EEF4F8" stroke="#134074" stroke-width="1.5" />
    
    <!-- QR Vector Image -->
    <g transform="translate(12, 12) scale(0.68)">
      <path fill="#EEF4F8" d="M0 0h31v31H0z"/><path stroke="#0B2545" d="M1 1.5h7m5 0h2m2 0h1m2 0h2m1 0h7M1 2.5h1m5 0h1m1 0h5m1 0h3m1 0h2m2 0h1m5 0h1M1 3.5h1m1 0h3m1 0h1m2 0h1m1 0h1m1 0h2m1 0h4m2 0h1m1 0h3m1 0h1M1 4.5h1m1 0h3m1 0h1m2 0h7m1 0h1m2 0h1m1 0h1m1 0h3m1 0h1M1 5.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h1m2 0h2m3 0h1m1 0h3m1 0h1M1 6.5h1m5 0h1m4 0h1m1 0h1m5 0h2m1 0h1m5 0h1M1 7.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M13 8.5h3m1 0h2m1 0h2M1 9.5h1m1 0h1m1 0h1m1 0h1m2 0h3m2 0h2m1 0h1m6 0h1m2 0h1M5 10.5h1m5 0h2m2 0h2m1 0h1m1 0h1m1 0h3m1 0h1m2 0h1M3 11.5h2m1 0h4m1 0h1m2 0h1m5 0h1m1 0h1m1 0h1m2 0h3M3 12.5h1m1 0h1m2 0h2m1 0h3m2 0h1m2 0h1m1 0h4m3 0h1M1 13.5h1m2 0h1m1 0h4m1 0h3m3 0h1m1 0h1m2 0h3m1 0h1m1 0h2M2 14.5h1m2 0h2m1 0h1m5 0h1m1 0h2m3 0h3m2 0h1m2 0h1M2 15.5h2m1 0h5m2 0h2m1 0h3m1 0h1m1 0h1m1 0h4m1 0h2M2 16.5h1m1 0h3m1 0h1m1 0h1m1 0h4m1 0h2m1 0h1m2 0h1m2 0h1m1 0h1M1 17.5h1m1 0h1m3 0h3m1 0h1m3 0h2m2 0h1m1 0h4m1 0h1m1 0h2M3 18.5h1m2 0h1m1 0h1m2 0h2m2 0h2m1 0h1m3 0h2m2 0h2m1 0h1M1 19.5h1m1 0h2m1 0h5m2 0h2m4 0h1m2 0h1m2 0h1m2 0h2M2 20.5h1m3 0h1m1 0h1m1 0h1m1 0h1m3 0h1m6 0h1m1 0h2m1 0h1M1 21.5h1m5 0h1m4 0h2m3 0h1m3 0h5M9 22.5h2m1 0h1m1 0h1m1 0h2m3 0h1m3 0h1m1 0h3M1 23.5h7m2 0h3m2 0h7m1 0h1m1 0h2m1 0h2M1 24.5h1m5 0h1m2 0h1m3 0h2m1 0h2m2 0h1m3 0h2m1 0h2M1 25.5h1m1 0h3m1 0h1m1 0h3m1 0h1m1 0h5m1 0h5m3 0h1M1 26.5h1m1 0h3m1 0h1m2 0h1m2 0h4m1 0h2m4 0h2m1 0h1M1 27.5h1m1 0h3m1 0h1m1 0h1m2 0h1m2 0h1m1 0h5m2 0h3m2 0h1M1 28.5h1m5 0h1m5 0h1m1 0h2m2 0h3m2 0h1m3 0h1M1 29.5h7m1 0h2m1 0h2m3 0h1m1 0h3m1 0h1m1 0h2m1 0h2"/>

    </g>

    <!-- Scan Instruction Label -->
    <text x="72.5" y="160" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9.5" fill="#0B2545" class="bold" letter-spacing="0.5">
      SCAN TO NAVIGATE
    </text>
  </g>

  <!-- Footer Watermark / National Standard -->
  <text x="300" y="326" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#8DA9C4" opacity="0.75" letter-spacing="0.8">
    ETHIOPIA OPEN NATIONAL ADDRESSING SYSTEM (ET-NAS) • PROJECT MEGENAGNA
  </text>
</svg>