name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-repo:
    name: Verify checkout & submodules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Confirm submodules resolved
        run: |
          git submodule status
          test -f open-location-code/README.md
